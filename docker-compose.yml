version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: stativa_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stativa}
      POSTGRES_USER: ${POSTGRES_USER:-stativa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stativa_secret_2026}
    volumes:
      - stativa_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stativa_user} -d ${POSTGRES_DB:-stativa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stativa_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stativa_user}:${POSTGRES_PASSWORD:-stativa_secret_2026}@db:5432/${POSTGRES_DB:-stativa}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-ganti-di-production}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - stativa_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: stativa_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  stativa_pgdata:
  stativa_uploads:
